# Deploy no Dokploy (tipo "Docker Compose"), apontando para este arquivo.
# Variáveis em Environment do Dokploy:
#   POSTGRES_PASSWORD, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   Gerar sua versão (SDD-12): CFIA_BASE_COMMIT, CFIA_BUILDER_TOKEN e, para o
#   aviso por e-mail, CFIA_SMTP_URL e CFIA_EMAIL_DE
# Domínio: em Domains, cfia.ysafe.com.br → serviço cfia-api, porta 8080, HTTPS ligado.
services:
  cfia-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cfia:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@cfia-db:5432/cfia
      BASE_URL: https://cfia.ysafe.com.br
      PORT: "8080"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Gerar sua versão (SDD-12). Sem CFIA_BASE_COMMIT, a função fica desligada.
      CFIA_BASE_COMMIT: ${CFIA_BASE_COMMIT:-}
      CFIA_BUILDER_TOKEN: ${CFIA_BUILDER_TOKEN:-}
      # E-mails sem o limite de 3 versões por dia (separados por vírgula).
      CFIA_SEM_LIMITE: ${CFIA_SEM_LIMITE:-}
      CFIA_VERSOES_DIR: /dados/versoes
      # Aviso de retenção por e-mail; sem estes, a limpeza roda e o aviso não sai.
      CFIA_SMTP_URL: ${CFIA_SMTP_URL:-}
      CFIA_EMAIL_DE: ${CFIA_EMAIL_DE:-}
    volumes:
      - cfia-versoes:/dados/versoes
    depends_on:
      cfia-db:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - interna
      - dokploy-network

  cfia-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cfia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: cfia
    volumes:
      - cfia-db-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfia -d cfia"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - interna

volumes:
  cfia-db-dados:
  cfia-versoes:

networks:
  interna:
  dokploy-network:
    external: true
